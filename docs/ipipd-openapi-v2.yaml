          type: string
          examples:
          - 192.168.1.0/24
          description: 指定网段CIDR格式（仅在线路支持自选网段时可用）
        quantity:
          type: integer
          format: int32
          examples:
          - 5
          description: 购买代理数量
          minimum: 1
        days:
          type: integer
          format: int32
          examples:
          - 30
          description: 购买天数。正式订单必须是30的倍数；isTest=true 时仍需为正数或使用默认值，最终会被系统固定为1天
          default: 30
          minimum: 1
        currency:
          type: string
          examples:
          - CNY
          description: 货币类型（当前创建订单按用户默认货币计价，该字段暂不生效）
        discountPackageId:
          type: string
          examples:
          - 789012
          description: 折扣包ID（可选）
        orderNo:
          type: string
          examples:
          - EXT_ORDER_123456
          description: 外部订单号（客户系统中的订单号）
        isTest:
          type: boolean
          examples:
          - false
          description: 是否为测试实例（默认false）。测试实例免费、有效期固定1天，且只支持可开出测试实例的渠道
          default: false
        sync:
          type: boolean
          examples:
