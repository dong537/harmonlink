
---
openapi: 3.1.0
components:
  schemas:
    AccountV2DTO:
      type: object
      description: 用户账户信息
      properties:
        userId:
          type: string
          examples:
          - 12345
          description: 用户唯一标识
        username:
          type: string
          examples:
          - john_doe
          description: 用户名
        email:
          type: string
          examples:
          - john@example.com
          description: 用户邮箱地址
        phone:
          type: string
          examples:
          - "+1234567890"
          description: 用户手机号码
        status:
          type: string
          examples:
          - ACTIVE
          description: 账户状态
        registeredAt:
          type: string
          examples:
          - 1703250000000
          description: 用户注册时间
        lastLoginAt:
          type: string
          examples:
          - 1703260000000
          description: 用户最后登录时间
        currency:
          type: string
          examples:
          - CNY
          description: 用户默认货币
        balance:
          type: number
          examples:
          - 100.5
          description: 用户默认货币的余额
        totalRechargeAmount:
          type: number
          examples:
          - 500.0
          description: 用户总充值金额（用户充值 + 管理员加余额）
    AdjustPointsRequest:
      type: object
      properties:
        userId:
          type: string
        campaignId:
          type: string
        points:
          type: integer
          format: int32
        reason:
          type: string
    AdjustPointsResult:
      type: object
      properties:
        success:
          type: boolean
        newBalance:
          type: integer
          format: int32
        message:
          type: string
    AdminAddBalanceRequest:
      type: object
      required:
      - userId
      - amount
      - currency
      - reason
      description: 管理员增加用户余额请求
      properties:
        userId:
          type: string
          description: 用户ID
        amount:
          type: number
          examples:
          - 100.0
          description: 增加的金额
          minimum: 0.01
        currency:
          type: string
          examples:
          - CNY
          maxLength: 10
          pattern: \\S
          description: 货币代码
        reason:
          type: string
          examples:
          - 管理员手动充值
          maxLength: 500
          pattern: \\S
          description: 增加余额的原因
        remarks:
          type: string
          examples:
          - 用户申请充值，已确认到账
          maxLength: 1000
          description: 备注信息
    AdminAssignReferrerRequest:
      type: object
      required:
      - userId
      - referrerId
      description: 管理员分配推荐人请求
      properties:
        userId:
          type: string
          description: 需要分配推荐人的用户ID
        referrerId:
          type: string
          description: 推荐人用户ID
        reason:
          type: string
          examples:
          - 管理员手动分配推荐关系
          maxLength: 500
          description: 分配推荐人的原因
        remarks:
          type: string
          examples:
          - 用户注册时未填写推荐码，现补充分配
          maxLength: 1000
          description: 备注信息
    AdminClientUserCouponDTO:
      type: object
      properties:
        id:
          type: string
        templateId:
          type: string
        userId:
          type: string
        couponCode:
          type: string
        name:
          type: string
        description:
          type: string
        ruleType:
          $ref: "#/components/schemas/CouponRuleTypeEnum"
        scope:
          $ref: "#/components/schemas/CouponScopeEnum"
        discountValue:
          type: number
        minAmount:
          type: number
        maxDiscount:
          type: number
        currency:
          type: string
        status:
          $ref: "#/components/schemas/CouponStatusEnum"
        obtainedAt:
          $ref: "#/components/schemas/LocalDateTime"
        usedAt:
          $ref: "#/components/schemas/LocalDateTime"
        validFrom:
          $ref: "#/components/schemas/LocalDateTime"
        validTo:
          $ref: "#/components/schemas/LocalDateTime"
        usedOrderId:
          type: string
        usedOrderNo:
          type: string
        remarks:
          type: string
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
        isUsable:
          type: boolean
        isExpired:
          type: boolean
        daysUntilExpiry:
          type: integer
          format: int32
        extra:
          type: string
        userObj:
          $ref: "#/components/schemas/ClientUserBO"
    AdminClientUserDTO:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        lastLoginAt:
          $ref: "#/components/schemas/LocalDateTime"
        lastLoginIp:
          type: string
        enabled:
          type: boolean
        phoneVerifiedAt:
          $ref: "#/components/schemas/LocalDateTime"
        remarks:
          type: string
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
        groupId:
          type: string
        groupName:
          type: string
        referrerId:
          type: string
        referrerObj:
          $ref: "#/components/schemas/AdminClientUserDTO"
        topAt:
          $ref: "#/components/schemas/LocalDateTime"
        salesAdminObj:
          $ref: "#/components/schemas/AdminUserDTO"
        hasSupport:
          type: boolean
    AdminClientUserRelationDTO:
      type: object
      properties:
        id:
          type: string
        adminUserId:
          type: string
        clientUserId:
          type: string
        clientUsername:
          type: string
        clientNickname:
          type: string
        clientEmail:
          type: string
        clientRemarks:
          type: string
        clientCreatedAt:
          $ref: "#/components/schemas/LocalDateTime"
        relationCreatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminCouponTemplateDTO:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        ruleType:
          $ref: "#/components/schemas/CouponRuleTypeEnum"
        scope:
          $ref: "#/components/schemas/CouponScopeEnum"
        discountValue:
          type: number
        minAmount:
          type: number
        maxDiscount:
          type: number
        currency:
          type: string
        validFrom:
          $ref: "#/components/schemas/LocalDateTime"
        validTo:
          $ref: "#/components/schemas/LocalDateTime"
        expireDays:
          type: integer
          format: int32
        visibleToClient:
          $ref: "#/components/schemas/IsEnum"
        maxUsePerUser:
          type: integer
          format: int32
        totalQuantity:
          type: integer
          format: int32
        issuedQuantity:
          type: integer
          format: int32
        usedQuantity:
          type: integer
          format: int32
        enabled:
          $ref: "#/components/schemas/IsEnum"
        sortOrder:
          type: integer
          format: int32
        remarks:
          type: string
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
        isValid:
          type: boolean
        canIssueMore:
          type: boolean
        isVisibleAndAvailableToClient:
          type: boolean
        remainingQuantity:
          type: integer
          format: int32
    AdminCreateOrderRequest:
      type: object
      required:
      - userId
      - staticLineId
      - quantity
      - duration
      description: 管理员创建订单请求
      properties:
        userId:
          type: string
          description: 用户ID
        staticLineId:
          type: string
          description: 静态线路ID
        quantity:
          type: integer
          exclusiveMinimum: 0
          format: int32
          description: 购买数量
        duration:
          type: integer
          exclusiveMinimum: 0
          format: int32
          description: 购买时长（天数）
        paymentType:
          $ref: "#/components/schemas/PaymentTypeEnum"
          type: string
          description: 支付方式，默认为余额支付
        autoRenewal:
          type: boolean
          description: 是否自动续费
        renewalDaysBefore:
          type: integer
          format: int32
          description: 续费提前天数
        selectedCidr:
          type: string
          description: 选择的网段CIDR，如 192.168.0.0/24
        remarks:
          type: string
          description: 备注
    AdminCreateVerificationRequest:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
        type:
          type: integer
          format: int32
        remarks:
          type: string
    AdminCurrencyBo:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        symbol:
          type: string
        number:
          type: integer
          format: int32
        precision:
          type: integer
          format: int32
        defaultCurrency:
          type: boolean
        enabled:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminDecreaseBalanceRequest:
      type: object
      required:
      - userId
      - amount
      - currency
      - reason
      description: 管理员减少用户余额请求
      properties:
        userId:
          type: string
          description: 用户ID
        amount:
          type: number
          examples:
          - 100.0
          description: 减少的金额
          minimum: 0.01
        currency:
          type: string
          examples:
          - CNY
          maxLength: 10
          pattern: \\S
          description: 货币代码
        reason:
          type: string
          examples:
          - 管理员手动扣款
          maxLength: 500
          pattern: \\S
          description: 减少余额的原因
        remarks:
          type: string
          examples:
          - 用户申请退款，已确认退款
          maxLength: 1000
          description: 备注信息
    AdminEraseClientUserRequest:
      type: object
      required:
      - reason
      - confirm
      properties:
        reason:
          type: string
          maxLength: 500
          pattern: \\S
        confirm:
          type: boolean
    AdminEraseClientUserResponse:
      type: object
      properties:
        auditLogId:
          type: string
        status:
          $ref: "#/components/schemas/ClientUserErasureStatusEnum"
        message:
          type: string
        alreadyProcessed:
          type: boolean
        startedAt:
          $ref: "#/components/schemas/LocalDateTime"
        completedAt:
          $ref: "#/components/schemas/LocalDateTime"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ClientUserErasureScopeDTO"
    AdminImpersonateCodeResponse:
      type: object
      description: 管理员生成登录码响应
      properties:
        success:
          type: boolean
          description: 是否成功
        loginCode:
          type: string
          description: 临时登录码
        userId:
          type: string
          description: 目标用户ID
        expiresInSeconds:
          type: integer
          format: int32
          description: 过期时间（秒）
        message:
          type: string
          description: 响应消息
    AdminInstanceSearchRequest:
      type: object
      description: Admin实例搜索请求
      properties:
        filters:
          type: array
          items:
            $ref: "#/components/schemas/QueryFilter"
        sorts:
          type: array
          items:
            $ref: "#/components/schemas/QuerySort"
        distinct:
          type: boolean
        distinctField:
          type: string
        current:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        proxyInfoQuery:
          type: string
          examples:
          - |-
            167.148.35.6:9832:user:pass
            167.148.35.5:9832
          description: 代理信息查询字符串，支持多行，每行一个代理信息
    AdminOperationStatsDTO:
      type: object
      description: 管理员操作统计
      properties:
        adminAddBalanceAmount:
          type: number
          examples:
          - 1000.0
          description: 管理员增加余额总金额
        adminAddBalanceCount:
          type: string
          examples:
          - 10
          description: 管理员增加余额交易数量
        adminDebitAmount:
          type: number
          examples:
          - 500.0
          description: 管理员扣款总金额
        adminDebitCount:
          type: string
          examples:
          - 5
          description: 管理员扣款交易数量
        adminRechargeAmount:
          type: number
          examples:
          - 2000.0
          description: 管理员充值总金额
        adminRechargeCount:
          type: string
          examples:
          - 20
          description: 管理员充值交易数量
        netOperationAmount:
          type: number
          examples:
          - 2500.0
          description: 净操作金额（增加余额 + 充值 - 扣款）
        currency:
          type: string
          examples:
          - CNY
          description: 货币代码
    AdminPartnerLinkDTO:
      type: object
      properties:
        id:
          type: string
        websiteName:
          type: string
        websiteUrl:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        contactEmail:
          type: string
        partnershipType:
          type: string
        enabled:
          $ref: "#/components/schemas/IsEnum"
        sortOrder:
          type: integer
          format: int32
        remarks:
          type: string
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
        isValid:
          type: boolean
    AdminPermissionBo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        parentId:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminReferralAccountDTO:
      type: object
      properties:
        id:
          type: string
        adminUserId:
          type: string
        referralCode:
          type: string
    AdminReferralAccountRequest:
      type: object
      required:
      - adminUserId
      properties:
        adminUserId:
          type: string
    AdminReferralCodeDTO:
      type: object
      properties:
        id:
          type: string
        adminUserId:
          type: string
        referralCode:
          type: string
    AdminRenewInstanceRequest:
      type: object
      required:
      - instanceIds
      - duration
      description: 管理员续费实例请求
      properties:
        instanceIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 要续费的实例ID列表
        duration:
          type: integer
          format: int32
          description: 续费时长（天数）
          minimum: 1
        remarks:
          type: string
          description: 备注
    AdminRenewInstanceResponse:
      type: object
      properties:
        orderNos:
          type: array
          items:
            type: string
          description: 成功创建的续费订单号列表
        failures:
          type: array
          items:
            $ref: "#/components/schemas/FailureInfo"
          description: 失败的实例信息列表
        message:
          type: string
          description: 操作消息
        successCount:
          type: integer
          format: int32
        failureCount:
          type: integer
          format: int32
    AdminReplyFeedbackRequest:
      type: object
      required:
      - adminReply
      - status
      properties:
        adminReply:
          type: string
          maxLength: 5000
          pattern: \\S
        status:
          $ref: "#/components/schemas/FeedbackStatusEnum"
        priority:
          type: integer
          format: int32
        adminId:
          type: string
    AdminRoleBo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string
        home:
          type: string
        enabled:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AdminPermissionBo"
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminStaticIpSwitchRecordDTO:
      type: object
      properties:
        id:
          type: string
        proxyId:
          type: string
        instanceId:
          type: string
        oldIp:
          type: string
        oldPort:
          type: integer
          format: int32
        newIp:
          type: string
        newPort:
          type: integer
          format: int32
        switchTime:
          $ref: "#/components/schemas/LocalDateTime"
        channelId:
          type: string
        requestParams:
          type: string
        responseParams:
          type: string
        success:
          $ref: "#/components/schemas/IsEnum"
        errorMessage:
          type: string
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminTransactionDTO:
      type: object
      properties:
        id:
          type: string
        transactionNo:
          type: string
        transactionType:
          $ref: "#/components/schemas/TransactionTypeEnum"
        externalTransactionNo:
          type: string
        userId:
          type: string
        userObj:
          $ref: "#/components/schemas/ClientUserBO"
        status:
          $ref: "#/components/schemas/TransactionStatusEnum"
        amount:
          type: number
        currency:
          type: string
        paymentMethod:
          $ref: "#/components/schemas/PaymentTypeEnum"
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        referenceType:
          $ref: "#/components/schemas/TransactionReferenceTypeEnum"
        referenceId:
          type: string
        referenceNo:
          type: string
        referenceObj: {}
        parentTransactionId:
          type: string
        refundedAmount:
          type: number
        completedAt:
          $ref: "#/components/schemas/LocalDateTime"
        failedAt:
          $ref: "#/components/schemas/LocalDateTime"
        expiredAt:
          $ref: "#/components/schemas/LocalDateTime"
        description:
          type: string
        remarks:
          type: string
        failureReason:
          type: string
        source:
          $ref: "#/components/schemas/TransactionSourceEnum"
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminUserBo:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        realname:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        avatar:
          type: string
        nickname:
          type: string
        lastLoginAt:
          $ref: "#/components/schemas/LocalDateTime"
        lastLoginIp:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminUserDTO:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        NickName:
          type: string
        email:
          type: string
        phone:
          type: string
        enabled:
          $ref: "#/components/schemas/IsEnum"
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        lastLoginAt:
          $ref: "#/components/schemas/LocalDateTime"
        nickName:
          type: string
    AdminVerificationDTO:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        userObj:
          $ref: "#/components/schemas/ClientUserBO"
        type:
          $ref: "#/components/schemas/UserVerificationType"
        status:
          $ref: "#/components/schemas/VerificationStatus"
        detailJson:
          type: string
        rejectReason:
          type: string
        reviewedAt:
          $ref: "#/components/schemas/LocalDateTime"
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    AdminWithdrawProcessRequest:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        processRemarks:
          type: string
          maxLength: 1000
    AdminWithdrawReviewRequest:
      type: object
      required:
      - approved
      properties:
        approved:
          type: boolean
        rejectReason:
          type: string
          maxLength: 500
        processRemarks:
          type: string
          maxLength: 1000
    AllocateInstanceRequest:
      type: object
      required:
      - instanceIds
      - targetUserId
      description: 分配静态代理实例请求
      properties:
        instanceIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 要分配的实例ID列表
        targetUserId:
          type: string
          description: 目标用户ID
        generateOrder:
          type: boolean
          examples:
          - true
          description: 是否生成订单，true-生成订单并扣费，false-直接分配
        remarks:
          type: string
          description: 备注信息
    AllocateInstanceResponse:
      type: object
      description: 分配静态代理实例响应
      properties:
        successCount:
          type: integer
          format: int32
          description: 成功分配的实例数量
        failureCount:
          type: integer
          format: int32
          description: 失败的实例数量
        totalAmount:
          type: number
          description: 总计费金额
        currency:
          type: string
          description: 货币类型
        orderNo:
          type: string
          description: 生成的订单号
        details:
          type: array
          items:
            $ref: "#/components/schemas/AllocationDetail"
          description: 分配详情
        allocatedAt:
          $ref: "#/components/schemas/LocalDateTime"
          type: string
          examples:
          - 2022-03-10T12:15:50
          description: 分配时间
    AllocationDetail:
      type: object
      description: 分配详情
      properties:
        instanceId:
          type: string
          description: 实例ID
        proxyId:
          type: string
          description: 代理ID
        ip:
          type: string
          description: IP地址
        port:
          type: integer
          format: int32
          description: 端口
        success:
          type: boolean
          description: 是否分配成功
        errorMessage:
          type: string
          description: 失败原因
    AnnouncementPageRequest:
      type: object
      description: 公告分页请求
      properties:
        current:
          type: integer
          format: int32
          examples:
          - 0
          description: 当前页码，从0开始
        size:
          type: integer
          format: int32
          examples:
          - 20
          description: 每页数据条数
    ApiApplicationBO:
      type: object
      properties:
        id:
          type: string
        appId:
          type: string
        appSecret:
          type: string
        userId:
          type: string
        appName:
          type: string
        description:
          type: string
        ipWhitelist:
          type: string
        expiresAt:
          $ref: "#/components/schemas/LocalDateTime"
        remarks:
          type: string
        callbackUrl:
          type: string
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    ApiKeyResponse:
      type: object
      properties:
        id:
          type: string
        appId:
          type: string
        appSecret:
          type: string
        appName:
          type: string
        description:
          type: string
        ipWhitelist:
          type: string
        expiresAt:
          $ref: "#/components/schemas/LocalDateTime"
        remarks:
          type: string
        callbackUrl:
          type: string
