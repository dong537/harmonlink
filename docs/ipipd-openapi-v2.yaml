paths:
  /admin/analytics/channel/consumption:
    post:
      summary: 获取渠道消费统计
      description: 根据时间范围和条件统计渠道消费情况
      operationId: getChannelConsumptionStats
      tags:
      - 渠道统计分析
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelConsumptionStatsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConsumptionStatsResponse"
        "400":
          description: Bad Request
  /admin/analytics/channel/consumption/export:
    post:
      summary: 导出渠道消费统计
      description: 导出渠道消费统计数据到Excel文件
      operationId: exportChannelConsumptionStats
      tags:
      - 渠道统计分析
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelConsumptionStatsRequest"
        required: true
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
  /admin/analytics/channel/consumption/summary:
    post:
      summary: 获取渠道消费概要
      description: 获取指定时间范围内的渠道消费概要信息
      operationId: getChannelConsumptionSummary
      tags:
      - 渠道统计分析
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelConsumptionSummaryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConsumptionStatsResponse"
        "400":
          description: Bad Request
  /admin/analytics/channel/consumption/trends:
    post:
      summary: 获取渠道消费趋势
      description: 获取指定时间范围内的渠道消费趋势数据
