          - USA
          description: 目标国家代码（ISO 3166-1 alpha-3，与线路ID二选一）
        cityCode:
          type: string
          examples:
          - NYC
          description: 目标城市代码（与线路ID二选一）
        businessType:
          type: string
          examples:
          - RESIDENTIAL
          description: 业务类型代码（使用国家/城市代码时必需）
        ispType:
          type: integer
          format: int32
          examples:
          - 1
          description: "ISP类型：0=NONE, 1=SHARED, 2=PREMIUM（使用国家/城市代码时必需）"
