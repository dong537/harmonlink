      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelCostStatsResponse"
        "400":
          description: Bad Request
  /admin/analytics/channel/cost-trend:
    post:
      summary: 获取渠道成本趋势分析
