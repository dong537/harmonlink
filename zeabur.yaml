name: harmonlink
services:
  - name: api
    dockerfile: ./apps/api/Dockerfile
    ports:
      - 3000
    environment:
      NODE_ENV: production
  
  - name: worker
    dockerfile: ./apps/worker/Dockerfile
    environment:
      NODE_ENV: production
  
  - name: web
    dockerfile: ./apps/web/Dockerfile
    ports:
      - 3000
    environment:
      NODE_ENV: production
